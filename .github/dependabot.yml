version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    assignees:
      - robcresswell
    commit-message:
      prefix: feat
      prefix-development: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - '@mdi/js'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - robcresswell
    commit-message:
      prefix: chore
      include: scope
